<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 60px auto;
            background-color: #fff;
            padding: 25px;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: normal;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }

        input::placeholder {
            color: #aaa;
        }

        .actions {
            margin-top: 20px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .register-link {
            margin-left: 10px;
            font-size: 14px;
        }

        .register-link a {
            color: #007bff;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    <p th:text="${succMsg}" class="text-success"></p>
    <p th:text="${errMsg}" class="text-danger"></p>

    <form th:action="@{/signIn}" th:object="${loginForm}" method="post">

        <div class="form-group">
            <label>Email-Id</label>
            <input type="email" placeholder="Enter email address" th:field="*{email}">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter password" th:field="*{password}">
        </div>

        <div class="actions">
            <button type="submit">Login</button>
            <span class="register-link">
                New user? <a th:href="@{/signUp}">Register Here</a>
            </span>
        </div>

    </form>
</div>

</body>
</html>
