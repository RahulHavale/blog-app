<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Create Post</h2>

<form th:action="@{/post/save}" th:object="${postForm}" method="post">
    <input type="text" th:field="*{title}" placeholder="Title"><br>
    <input type="text" th:field="*{description}" placeholder="Description"><br>
    <textarea th:field="*{content}"></textarea><br>
    <button type="submit">Save</button>
</form>

<a th:href="@{/posts}">Back</a>
</body>
</html>
